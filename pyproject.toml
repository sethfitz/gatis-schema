[project]
name = "gatis-schema"
dynamic = ["version"]
description = "Pydantic models for the General Active Transportation Infrastructure Specification (GATIS), generated from the upstream spec workbook"
readme = "README.md"
authors = [
    { name = "Seth Fitzsimmons", email = "seth@mojodna.net" }
]
requires-python = ">=3.12"
dependencies = [
    "overture-schema-system>=2.0.0",
    "pydantic>=2.9",
]

# Registers the models for Overture's discovery system, which is how
# `overture-codegen` finds them. A discriminated-union alias is resolved to every
# arm, so the first four cover all twenty-one feature types.
#
# The three extension tables are rows of a plain JSON file rather than GeoJSON
# features, so the system's own tag provider does not tag them `feature` and a
# `--tag feature` run drops them. `gatis_schema.tag_providers` gives them
# `gatis:extension` instead; `scripts/generate-reference` asks for both tags.
[project.entry-points."overture.models"]
gatis_node = "gatis_schema.models:Node"
gatis_edge = "gatis_schema.models:Edge"
gatis_point = "gatis_schema.models:Point"
gatis_zone = "gatis_schema.models:Zone"
gatis_lrs_crosswalk = "gatis_schema.models:LrsCrosswalk"
gatis_event = "gatis_schema.models:Event"
gatis_relation = "gatis_schema.models:Relation"

[project.entry-points."overture.tag_providers"]
gatis = "gatis_schema.tag_providers:gatis_provider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[dependency-groups]
dev = [
    # The emitted JSON Schema is asserted on by behaviour, not by text -- see
    # tests/test_codegen.py. Without this the test skips, and a skipped control
    # reads as a pass.
    "jsonschema>=4",
    "pytest>=8",
    "mypy>=1.11",
    "overture-schema-codegen>=2.0.0",
    "overture-schema-theme-transportation>=2.0.0",
    "ruff>=0.14",
]


[tool.hatch.build.targets.wheel]
packages = ["src/gatis_schema"]

[tool.hatch.build]
include = [
    "src/gatis_schema/py.typed",  # Include type marker in distribution
]

[tool.hatch.version]
path = "src/gatis_schema/__init__.py"  # Hatch reads __version__ from here


# Per-package mypy configuration
[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
files = ["src", "tests"]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
warn_return_any = false


[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# The spec's own prose carries curly quotes and en dashes, and descriptions are
# copied verbatim rather than sanitised.
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# `(str, DocumentedEnum)` is the Overture system's own idiom, and StrEnum is not
# a drop-in for it. Presence matches the generated enums deliberately.
"src/gatis_schema/presence.py" = ["UP042"]

[tool.ruff.format]
docstring-code-format = true


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-q",
    "-ra",  # show summary of all test outcomes
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]
